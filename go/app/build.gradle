plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.rehome.go'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rehome.go'
        minSdk 23
        targetSdk 30
        versionCode 26
        versionName '2.4.1'
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks != null && new File(ks).exists()) {
                storeFile new File(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_FILE') != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
