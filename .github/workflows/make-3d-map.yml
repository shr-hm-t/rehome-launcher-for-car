name: Make 3D map file
on:
  workflow_dispatch:
    inputs:
      area:
        description: "Area name as used by Geofabrik or Planetiler, for example sri-lanka, monaco, germany, india. Small countries work best."
        required: true
        default: "sri-lanka"
permissions:
  contents: write
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          df -h / /mnt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download Planetiler
        run: curl -L -o planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
      - name: Make the map (OpenStreetMap data, OpenMapTiles layout)
        run: |
          AREA="${{ github.event.inputs.area }}"
          java -Xmx5g -jar planetiler.jar --download --area="$AREA" --output="$AREA.mbtiles" --tmpdir=/mnt/work/tmp --download_dir=/mnt/work/data
          ls -la
      - name: Publish as a public download (no GitHub login needed to download it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AREA="${{ github.event.inputs.area }}"
          TAG="map-$AREA"
          R="${{ github.repository }}"
          gh release view "$TAG" --repo "$R" >/dev/null 2>&1 || gh release create "$TAG" --repo "$R" --prerelease --title "3D map: $AREA" \
            --notes "Vector map for Rehome 3D (OpenMapTiles layout), made from OpenStreetMap data. Map data (c) OpenStreetMap contributors, ODbL."
          gh release upload "$TAG" "$AREA.mbtiles" --repo "$R" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: 3d-map-${{ github.event.inputs.area }}
          path: "*.mbtiles"
          retention-days: 14
