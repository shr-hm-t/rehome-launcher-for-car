name: Release both APKs
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example bundle-1.7-go-2.4.5"
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode signing key (if the secrets exist)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Using the fixed release key"
          else
            echo "No signing secrets: using the debug key"
          fi
      - name: Build the launcher
        run: gradle assembleRelease --no-daemon
      - name: Build Go
        working-directory: go
        run: gradle assembleRelease --no-daemon
      - name: Name the APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk Rehome.apk
          cp go/app/build/outputs/apk/release/app-release.apk Rehome-Go.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          {
            echo "Both apps in one place: **Rehome 1.7** (full launcher, Rehome.apk) and **Rehome: Go 2.4.5** (Home app with buttons and Boot Pack, Rehome-Go.apk)."
            echo
            awk '/^## Go 2.4.5/{f=1; print; next} /^## /{f=0} f' RELEASE_NOTES.md
            awk '/^## 1.7 /{f=1; print; next} /^## /{f=0} f' RELEASE_NOTES.md
          } > notes.md
          gh release create "$TAG" Rehome.apk Rehome-Go.apk --title "Rehome 1.7 + Go 2.4.5" --notes-file notes.md
